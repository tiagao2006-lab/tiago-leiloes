
name: Atualizar Imoveis Caixa Brasil

on:
  schedule:
    # Todos os dias as 09:00 de Brasilia (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar listas oficiais da Caixa
        shell: bash
        run: |
          mkdir -p dados
          sucesso=0
          falhas=0

          for uf in AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO; do
            echo "Baixando imoveis de ${uf}..."

            if curl --fail --location --retry 3 \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 90 \
              --user-agent "Mozilla/5.0" \
              --header "Accept: text/csv,*/*" \
              "https://venda-imoveis.caixa.gov.br/listaweb/Lista_imoveis_${uf}.csv" \
              -o "dados/${uf}.csv"; then

              if [ -s "dados/${uf}.csv" ]; then
                echo "Download concluido: ${uf}"
                sucesso=$((sucesso + 1))
              else
                echo "Arquivo vazio: ${uf}"
                rm -f "dados/${uf}.csv"
                falhas=$((falhas + 1))
              fi
            else
              echo "Falha no download: ${uf}"
              rm -f "dados/${uf}.csv"
              falhas=$((falhas + 1))
            fi
          done

          echo "Estados baixados: ${sucesso}"
          echo "Estados com falha: ${falhas}"

          if [ "$sucesso" -ne 27 ]; then
            echo "::error::Atualizacao incompleta. Publicacao cancelada."
            exit 1
          fi

      - name: Consolidar e publicar
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_URL: ${{ vars.API_URL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import csv
          import io
          import re
          import unicodedata
          import urllib.request
          from pathlib import Path

          UFS = (
              "AC AL AM AP BA CE DF ES GO MA MG MS MT "
              "PA PB PE PI PR RJ RN RO RR RS SC SE SP TO"
          ).split()

          def normalizar(valor):
              valor = valor.replace("\ufeff", "").strip()
              valor = unicodedata.normalize("NFKD", valor)
              valor = "".join(
                  c for c in valor
                  if not unicodedata.combining(c)
              )
              valor = valor.upper()
              valor = re.sub(r"\s+", " ", valor)
              return valor

          def decodificar(bruto):
              for encoding in ("utf-8-sig", "cp1252"):
                  try:
                      return bruto.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              raise ValueError("Codificacao nao reconhecida")

          arquivos = [
              Path("dados") / f"{uf}.csv"
              for uf in UFS
          ]

          if not all(p.is_file() for p in arquivos):
              raise ValueError("Faltam arquivos estaduais")

          cabecalho_final = []
          nomes_colunas = set()
          registros = []
          totais = {}

          for uf, arquivo in zip(UFS, arquivos):
              texto = decodificar(arquivo.read_bytes())

              if not texto.strip():
                  raise ValueError(f"Arquivo vazio: {uf}")

              leitor = csv.reader(
                  io.StringIO(texto),
                  delimiter=";"
              )

              dados = iter(leitor)

              try:
                  cabecalho_original = next(dados)
              except StopIteration:
                  raise ValueError(f"Sem cabecalho: {uf}")

              cabecalho = [
                  normalizar(c)
                  for c in cabecalho_original
              ]

              if not all(cabecalho):
                  raise ValueError(
                      f"Coluna sem nome: {uf}"
                  )

              if len(set(cabecalho)) != len(cabecalho):
                  raise ValueError(
                      f"Colunas duplicadas: {uf}"
                  )

              for coluna in cabecalho:
                  if coluna not in nomes_colunas:
                      nomes_colunas.add(coluna)
                      cabecalho_final.append(coluna)

              quantidade = 0

              for numero, linha in enumerate(dados, start=2):
                  if not linha or not any(
                      valor.strip() for valor in linha
                  ):
                      continue

                  if len(linha) != len(cabecalho):
                      raise ValueError(
                          f"{uf}, linha {numero}: "
                          f"{len(linha)} campos; "
                          f"esperados {len(cabecalho)}"
                      )

                  registro = dict(zip(cabecalho, linha))
                  registros.append(registro)
                  quantidade += 1

              if quantidade == 0:
                  raise ValueError(
                      f"Nenhum imovel encontrado em {uf}"
                  )

              totais[uf] = quantidade
              print(f"{uf}: {quantidade} imoveis")

          if not registros:
              raise ValueError("Nenhum imovel encontrado")

          print("Total de imoveis:", len(registros))
          print("Total de colunas:", len(cabecalho_final))

          saida = io.StringIO()
          escritor = csv.DictWriter(
              saida,
              fieldnames=cabecalho_final,
              delimiter=";",
              lineterminator="\n",
              extrasaction="raise"
          )

          escritor.writeheader()
          escritor.writerows(registros)

          url = os.environ.get("API_URL", "").strip()
          token = os.environ.get("ADMIN_TOKEN", "").strip()

          if not url or not token:
              raise ValueError(
                  "API_URL ou ADMIN_TOKEN ausente"
              )

          conteudo = saida.getvalue().encode("utf-8")

          print(
              "Tamanho do CSV:",
              len(conteudo),
              "bytes"
          )

          req = urllib.request.Request(
              url,
              data=conteudo,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "text/csv; charset=utf-8",
                  "X-CSV-Name": "Caixa_Brasil.csv"
              },
              method="PUT"
          )

          with urllib.request.urlopen(
              req, timeout=120
          ) as resp:
              print("Publicacao HTTP:", resp.status)
              print(
                  resp.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )

          print("ATUALIZACAO CONCLUIDA COM SUCESSO!")
          PY
